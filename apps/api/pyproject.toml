[project]
name = "velmora-api"
version = "0.1.0"
description = "API de VELMORA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.8,<3",
    "supabase>=2.13,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["velmora*"]

[tool.vercel]
entrypoint = "velmora.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
